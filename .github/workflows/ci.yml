name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ----------------------------------------------------------------
  # Go server: build + vet
  # ----------------------------------------------------------------
  go-server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  # ----------------------------------------------------------------
  # Python engines: lint + import check
  # ----------------------------------------------------------------
  python-engines:
    name: Python engines
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [audio-to-midi, emotional-engine]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (${{ matrix.engine }})
        run: |
          pip install --upgrade pip
          pip install -r engines/${{ matrix.engine }}/requirements.txt

      - name: Syntax check (${{ matrix.engine }})
        run: python -m py_compile engines/${{ matrix.engine }}/main.py

  # ----------------------------------------------------------------
  # Docker Compose build check (no push)
  # ----------------------------------------------------------------
  compose-build:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: [go-server, python-engines]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build --parallel
